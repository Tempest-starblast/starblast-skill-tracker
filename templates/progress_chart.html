{# Interactive skill-progress chart. Host page must {% set progress_name = <player name> %}
   before including. Everything is self-contained: styles, markup, script. #}
<div class="card" id="progCard" style="display:none">
  <div style="display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between">
    <h2 style="margin:0">Skill progress</h2>
    <div id="progRanges" style="display:flex;gap:6px"></div>
  </div>
  <div style="display:flex;gap:18px;flex-wrap:wrap;align-items:baseline;margin:6px 0 2px">
    <span id="progNow" style="font-size:22px;font-weight:700"></span>
    <span id="progNet" style="font-size:13px;font-weight:700"></span>
    <span class="pdesc" style="font-size:12px;color:var(--muted,#8aa0b0)">hover a point &mdash; click one to open that match&#39;s replay</span>
  </div>
  <div id="progWrap" style="position:relative;overflow:hidden">
    <svg id="progSvg" viewBox="0 0 860 300" preserveAspectRatio="xMidYMid meet"
         style="display:block;width:100%;height:auto;cursor:crosshair"></svg>
    <div id="progTip" style="display:none;position:absolute;pointer-events:none;z-index:5;
         background:rgba(6,11,20,.92);border:1px solid rgba(153,221,255,.3);border-radius:4px;
         padding:8px 11px;font-size:12.5px;line-height:1.5;max-width:240px;
         backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)"></div>
  </div>
</div>
<script>
(function(){
  const NAME = {{ progress_name|tojson }};
  if(!NAME) return;
  const W=860,H=300,padL=52,padB=24,padT=14,padR=14;
  const GREEN='#66e6b8',RED='#ff7a7a',LINE='#6ec1ff';
  let all=[],start=1000,range=0; /* 0 = everything */
  const svg=document.getElementById('progSvg'),tip=document.getElementById('progTip'),
        wrap=document.getElementById('progWrap'),card=document.getElementById('progCard');
  let view=[],xs=[],ys=[];
  function esc(s){const d=document.createElement('span');d.textContent=String(s==null?'':s);return d.innerHTML;}
  function build(){
    view = range>0 ? all.slice(-range) : all.slice();
    if(!view.length) return;
    /* the point before the window, so the first segment has an anchor */
    const prev = range>0 && all.length>view.length ? all[all.length-view.length-1].elo : start;
    const vals=view.map(p=>p.elo).concat([prev]);
    let lo=Math.min.apply(null,vals), hi=Math.max.apply(null,vals);
    const margin=Math.max(20,(hi-lo)*0.12); lo-=margin; hi+=margin;
    const n=view.length;
    const X=i=>padL+(W-padL-padR)*(n===1?0.5:(i/(n-1)));
    const Y=v=>(H-padB)-(H-padB-padT)*((v-lo)/(hi-lo));
    xs=view.map((p,i)=>X(i)); ys=view.map(p=>Y(p.elo));
    let g='';
    for(let k=0;k<=4;k++){
      const v=lo+(hi-lo)*k/4, y=Y(v);
      g+='<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="rgba(153,221,255,.12)"/>'
        +'<text x="'+(padL-7)+'" y="'+(y+4)+'" text-anchor="end" font-size="11" fill="#8aa0b0">'+Math.round(v)+'</text>';
    }
    /* peak line */
    const peak=Math.max.apply(null,view.map(p=>p.elo)), py=Y(peak);
    g+='<line x1="'+padL+'" y1="'+py+'" x2="'+(W-padR)+'" y2="'+py+'" stroke="rgba(255,215,106,.35)" stroke-dasharray="4 5"/>'
      +'<text x="'+(W-padR)+'" y="'+(py-5)+'" text-anchor="end" font-size="10.5" fill="#ffd76a">peak '+peak.toFixed(1)+'</text>';
    /* area fill under the line */
    let pts=[[X(0),Y(prev)]].concat(view.map((p,i)=>[xs[i],ys[i]]));
    if(n===1) pts=[[padL,Y(prev)],[xs[0],ys[0]]];
    const pl=pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
    g+='<polygon points="'+pl+' '+(W-padR)+','+(H-padB)+' '+padL+','+(H-padB)+'" fill="rgba(110,193,255,.07)"/>';
    g+='<polyline id="progLine" points="'+pl+'" fill="none" stroke="'+LINE+'" stroke-width="2" stroke-linejoin="round"/>';
    /* one dot per match: green win, red loss, ring when half */
    view.forEach((p,i)=>{
      const c=p.won?GREEN:RED;
      g+=p.half
        ?'<circle cx="'+xs[i]+'" cy="'+ys[i]+'" r="3.6" fill="none" stroke="'+c+'" stroke-width="2"/>'
        :'<circle cx="'+xs[i]+'" cy="'+ys[i]+'" r="3.4" fill="'+c+'"/>';
    });
    /* crosshair + focus ring, moved on hover */
    g+='<line id="progX" x1="0" y1="'+padT+'" x2="0" y2="'+(H-padB)+'" stroke="rgba(226,238,255,.35)" style="display:none"/>'
      +'<circle id="progF" r="6" fill="none" stroke="#fff" stroke-width="1.6" style="display:none"/>';
    svg.innerHTML=g;
    /* animated draw */
    const line=document.getElementById('progLine');
    try{const len=line.getTotalLength();
      line.style.strokeDasharray=len; line.style.strokeDashoffset=len;
      line.getBoundingClientRect();
      line.style.transition='stroke-dashoffset .9s ease';
      line.style.strokeDashoffset='0';
    }catch(e){}
    /* header numbers */
    const net=view[view.length-1].elo-(range>0?prev:start);
    document.getElementById('progNow').textContent=view[view.length-1].elo.toFixed(1);
    const netEl=document.getElementById('progNet');
    netEl.textContent=(net>=0?'+':'')+net.toFixed(1)+(range>0?' over last '+view.length:' all time');
    netEl.style.color=net>=0?GREEN:RED;
  }
  let cur=-1;
  function nearest(evx){
    const r=svg.getBoundingClientRect(), px=(evx-r.left)*(W/r.width);
    let best=0,bd=1e9;
    for(let i=0;i<xs.length;i++){const d=Math.abs(xs[i]-px); if(d<bd){bd=d;best=i;}}
    return best;
  }
  function show(i,clientY){
    if(i===cur&&tip.style.display!=='none')return; cur=i;
    const p=view[i], xl=document.getElementById('progX'), f=document.getElementById('progF');
    xl.setAttribute('x1',xs[i]); xl.setAttribute('x2',xs[i]); xl.style.display='';
    f.setAttribute('cx',xs[i]); f.setAttribute('cy',ys[i]);
    f.setAttribute('stroke',p.won?GREEN:RED); f.style.display='';
    const sign=p.delta>=0?'+':'';
    tip.innerHTML='<b>'+esc(p.at)+'</b><br>'+esc(p.lobby||'')+(p.lobby?' &middot; ':'')+esc(p.region)
      +'<br><span style="color:'+(p.won?GREEN:RED)+';font-weight:700">'+(p.won?'Won':'Lost')
      +(p.half?' (half)':'')+' '+sign+p.delta.toFixed(1)+'</span> &rarr; <b>'+p.elo.toFixed(1)+'</b>'
      +(p.score!=null?'<br>score '+esc(p.score):'')
      +(p.replay?'<br><span style="color:#9adcff">&#9654; click for replay</span>':'');
    tip.style.display='block';
    const r=svg.getBoundingClientRect(), sx=xs[i]*(r.width/W);
    const left=sx>r.width*0.62 ? sx-tip.offsetWidth-14 : sx+14;
    tip.style.left=Math.max(0,left)+'px';
    tip.style.top=Math.max(0,(ys[i]*(r.height/H))-tip.offsetHeight/2)+'px';
  }
  function hide(){tip.style.display='none';cur=-1;
    const a=document.getElementById('progX'),b=document.getElementById('progF');
    if(a)a.style.display='none'; if(b)b.style.display='none';}
  svg.addEventListener('mousemove',e=>{if(view.length){show(nearest(e.clientX),e.clientY);}});
  svg.addEventListener('mouseleave',hide);
  svg.addEventListener('touchstart',e=>{if(view.length&&e.touches[0]){show(nearest(e.touches[0].clientX));e.preventDefault();}},{passive:false});
  svg.addEventListener('touchmove',e=>{if(view.length&&e.touches[0]){show(nearest(e.touches[0].clientX));e.preventDefault();}},{passive:false});
  svg.addEventListener('click',e=>{
    if(!view.length)return; const p=view[nearest(e.clientX)];
    if(p&&p.replay&&p.mid)location.href='/replay/'+p.mid;
  });
  function ranges(){
    const box=document.getElementById('progRanges');
    const opts=[[0,'All'],[50,'50'],[20,'20']].filter(o=>o[0]===0||all.length>o[0]);
    box.innerHTML='';
    opts.forEach(o=>{
      const b=document.createElement('button');
      b.textContent=o[1];
      b.style.cssText='font-size:12px;padding:4px 12px;border-radius:3px;cursor:pointer;'
        +'border:1px solid '+(range===o[0]?'rgba(153,221,255,.55)':'var(--line)')
        +';background:'+(range===o[0]?'rgba(153,221,255,.12)':'rgba(0,0,0,.25)')+';color:inherit';
      b.onclick=()=>{range=o[0];hide();build();ranges();};
      box.appendChild(b);
    });
  }
  fetch('/api/player/progress?name='+encodeURIComponent(NAME)).then(r=>r.json()).then(d=>{
    if(!d||!d.matches||d.matches.length<2)return; /* one point is not a chart */
    all=d.matches; start=d.start;
    card.style.display='';
    build(); ranges();
  }).catch(()=>{});
})();
</script>
