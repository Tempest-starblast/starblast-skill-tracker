{# The asteroid-field generator, rewritten so it can be read: window.SBMapGen.grid(seed, mapSize, teams)
   turns a seed into the custom-map string the game would build for it. Validated to match the game's
   own generator exactly (see the header comment). The map editor and the lobby include this. #}
<script>
(function (root) {
  'use strict';
  /* Starblast asteroid-field generator, readable edition.
   *
   * The game builds every lobby's asteroid field from its map seed alone, using a
   * small seeded random number generator plus tiled value noise. This is that
   * algorithm rewritten with real names so it can be read, checked and fixed. It
   * reproduces the game's own generator exactly - validated cell-for-cell against
   * the original across thousands of seeds, every map size and both team settings.
   *
   * The only thing kept verbatim is the 1024-entry permutation table at the
   * bottom: it is what makes the noise, and so the maps, come out the same as in
   * game. Everything else is ordinary code.
   *
   * How a map is made:
   *   seed -> Random -> hash weights, noise period, noise frequencies, noise seed
   *   for each cell (x, y):
   *     density = blend(ramp rising toward the edge, tiled noise) * lane modifier
   *     the cell's own hash decides on/off against that density, then its size
   *
   * Floating-point note: expressions are kept in the same order as the game's so
   * the results round identically. Reordering a*b+c into c+b*a can flip a cell.
   */

  // ---------------------------------------------------------------------------
  // 1. Seeded random numbers: a 30-bit linear congruential generator,
  //      state = (state * 13971 + 12345) mod 2^30
  // ---------------------------------------------------------------------------
  var LCG_A = 13971, LCG_C = 12345, LCG_MOD = 1 << 30, LCG_MASK = LCG_MOD - 1, LCG_INV = 1 / LCG_MOD;

  function lcgStep(state) { return (state * LCG_A + LCG_C) & LCG_MASK; }

  function Random(seed) {
    this.state = seed;
    if (this.state < 1) this.state *= LCG_MOD;              // a fraction in [0,1) becomes a 30-bit integer
    this.state = lcgStep(lcgStep(lcgStep(this.state)));     // warm up
  }
  Random.prototype.next = function () {                      // uniform in [0, 1)
    this.state = lcgStep(this.state);
    return this.state * LCG_INV;
  };
  Random.prototype.nextInt = function (max) {                // integer in 0 .. max-1
    return Math.floor(this.next() * max);
  };

  // ---------------------------------------------------------------------------
  // 2. Value noise on a 1024-cell lattice, looked up through the permutation
  //    table. Three octaves are stacked, each twisted by 0.3 rad and zoomed by
  //    1.9x so the layers don't share grid lines, and the result is tiled with a
  //    period so the field wraps.
  // ---------------------------------------------------------------------------
  var LATTICE_MASK = 1023, LATTICE_NORM = 1 / 1023;
  var OCTAVE_FALLOFF = 0.5, OCTAVE_ZOOM = 1.9, OCTAVE_TWIST = 0.3;

  function smoothstep(a, b, t) { var s = (-2 * t + 3) * t * t; return a * (1 - s) + b * s; }

  function Noise(seed) {
    if (seed < 1) seed *= 1 << 30;
    this.offA = seed & LATTICE_MASK;                 // two 10-bit slices of the seed shift the lookups
    this.offB = (seed >> 10) & LATTICE_MASK;
    this.cos = Math.cos(OCTAVE_TWIST);
    this.sin = Math.sin(OCTAVE_TWIST);
  }

  // Bilinear value noise at (x, y): the four lattice corners, smoothly blended.
  Noise.prototype.value2d = function (x, y) {
    var xi = Math.floor(x), yi = Math.floor(y);
    var fx = x - xi, fy = y - yi;
    xi &= LATTICE_MASK; yi &= LATTICE_MASK;
    var row0 = PERM[yi + this.offB], row1 = PERM[yi + 1 + this.offB];
    var v00 = PERM[this.offA + PERM[xi + row0]];
    var v10 = PERM[this.offA + PERM[xi + 1 + row0]];
    var v01 = PERM[this.offA + PERM[xi + row1]];
    var v11 = PERM[this.offA + PERM[xi + 1 + row1]];
    return smoothstep(smoothstep(v00, v10, fx), smoothstep(v01, v11, fx), fy) * LATTICE_NORM;
  };

  // Several octaves of value2d, each twisted and zoomed relative to the last.
  Noise.prototype.fractal2d = function (x, y, octaves) {
    var sum = 0, amp = 1, total = 0;
    for (var i = 1; i <= octaves; i++) {
      sum += this.value2d(x, y) * amp;
      total += amp;
      amp *= OCTAVE_FALLOFF;
      var tx = OCTAVE_ZOOM * (x * this.cos + y * this.sin);
      var ty = OCTAVE_ZOOM * (y * this.cos - x * this.sin);
      x = tx; y = ty;
    }
    return sum / total;
  };

  // fractal2d made to repeat every `period` units, by blending the four
  // period-shifted copies of the point.
  Noise.prototype.periodic2d = function (x, y, period, octaves) {
    var cx = Math.floor(x / period), cy = Math.floor(y / period);
    var fx = x / period - cx, fy = y / period - cy;
    var n00 = this.fractal2d(fx * period, fy * period, octaves);
    var n10 = this.fractal2d(fx * period + period, fy * period, octaves);
    var n01 = this.fractal2d(fx * period, fy * period + period, octaves);
    var n11 = this.fractal2d(fx * period + period, fy * period + period, octaves);
    return smoothstep(smoothstep(n00, n10, 1 - fx), smoothstep(n01, n11, 1 - fx), 1 - fy);
  };

  // ---------------------------------------------------------------------------
  // 3. The asteroid field: `half` cells from the centre to each edge, so the
  //    grid is 2*half wide. Cells are independent - each has its own hash - so
  //    any one can be computed on its own.
  // ---------------------------------------------------------------------------
  function Field(seed, half, teams) {
    this.half = half;
    this.n = 2 * half;
    var rng = new Random(seed);
    this.hashX = 1e5 * rng.next();                         // per-cell hash weights
    this.hashY = 1e5 * rng.next();
    this.period = 1 + rng.nextInt(8);                      // noise tiling period, 1..8
    this.freqX = (2 + 8 * rng.next()) / (2 * half);        // noise frequency per cell
    this.freqY = (2 + 8 * rng.next()) / (2 * half);
    this.noise = new Noise(rng.next());
    // Team games keep a lane clear along the ring the stations orbit; a
    // one-team game keeps it clear around the sun at the centre instead.
    this.laneRadius = (teams === 1) ? 0 : 0.5 * Math.sqrt(2);
  }

  // 1 where asteroids may appear, 0 in the cleared lane.
  Field.prototype.laneModifier = function (x, y) {
    var ux = 2 * x / this.n, uy = 2 * y / this.n;           // -1..1 across the map
    var r = Math.sqrt(ux * ux + uy * uy);
    return Math.abs(r - this.laneRadius) < 0.15 ? 0 : 1;
  };

  // Nudges a uniform 0..1 offset toward 0 or 1, so an asteroid sits off-centre
  // in its cell rather than on a grid.
  function pushToEdge(v) {
    return v > 0.5 ? 0.5 * Math.pow(2 * (v - 0.5), 0.1) + 0.5
                   : 0.5 - 0.5 * Math.pow(2 * (0.5 - v), 0.1);
  }

  // The asteroid in cell (x, y), or null. `size` is in cells (0.1 .. 0.6);
  // x/y are the asteroid's centre, which the map grid does not need but a
  // simulation does.
  Field.prototype.cell = function (x, y) {
    var h = x * this.hashX + y * this.hashY;
    h = lcgStep(h); h = lcgStep(h); h = lcgStep(h);

    var radius = Math.sqrt((x * x + y * y) / (this.half * this.half));
    var density = radius > 1 ? 0.5 : 0.5 * Math.pow(radius, 5);            // ramps up toward the edge
    var noise = this.noise.periodic2d((x + this.half) * this.freqX, (y + this.half) * this.freqY, this.period, 3);
    density = density * 0.5 + 0.5 * (noise - 0.5);                          // half ramp, half noise
    density = Math.max(4 / this.n, density);
    density *= this.laneModifier(x, y);

    h = lcgStep(h);
    if (h * LCG_INV >= density) return null;

    h = lcgStep(h);
    var size = 0.1 + 0.5 * h * LCG_INV;
    h = lcgStep(h); var ox = pushToEdge(h * LCG_INV);
    h = lcgStep(h); var oy = pushToEdge(h * LCG_INV);
    return { size: size, x: x + size + ox * (1 - 2 * size), y: y + size + oy * (1 - 2 * size) };
  };

  // ---------------------------------------------------------------------------
  // 4. Seed -> custom-map string. The field's grid IS the custom-map grid; a
  //    cell's size maps to a digit by round(size * 18), because the game reads
  //    a digit d back as size = 0.5 * d / 9. Row 0 of a custom map is the TOP
  //    of the world (y = half-1): the game reads rows top-down, so we emit them
  //    top-down. (Verified cell-for-cell against ServerList+'s getMap.)
  // ---------------------------------------------------------------------------
  function grid(seed, mapSize, teams) {
    var half = Math.max(2, Math.round(mapSize / 2));
    var field = new Field(parseInt(seed, 10) || 0, half, Math.max(1, parseInt(teams, 10) || 3));
    var n = 2 * half, rows = [];
    for (var r = 0; r < n; r++) {
      var line = '';
      for (var c = 0; c < n; c++) {
        var cell = field.cell(c - half, half - 1 - r), d = 0;
        if (cell) { d = Math.round(cell.size * 18); if (d < 1) d = 1; if (d > 9) d = 9; }
        line += d ? String(d) : ' ';
      }
      rows.push(line);
    }
    return rows.join(String.fromCharCode(10));
  }
